services:
  - type: web
    name: hrms-lite-api
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./hrms.db
      - key: ALLOWED_ORIGINS
        sync: false
